name: measure

# The full benchmark and the fingerprinted draws on GitHub's Linux runner, kept out of pull-request
# CI: run it by pushing a commit to a branch named measure/..., or from the Actions tab once this
# file is on the default branch. Download the artifact, then see benchmarks/README.md and
# COMPATIBILITY.md for what to do with it.

on:
  workflow_dispatch:
  push:
    branches: ["measure/**"]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.73.0
          locked: true
          cache: true
      - run: pixi run python test/fingerprints.py --save measured/draws/linux-x86_64
      - run: pixi run python benchmarks/run.py --out measured/linux-x86_64.json
      - run: pixi run python benchmarks/report.py measured/linux-x86_64.json --out measured/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: measured-${{ github.sha }}
          path: measured/
