[project]
name = "plurel"
version = "1.1.0"
description = "Synthesize diverse multi-tabular relational databases using Structural Causal Models, enabling scaling laws for Relational Foundation Models."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Vignesh Kothapalli" },
    { name = "Rishabh Ranjan" },
    { name = "Valter Hudovernik" },
    { name = "Vijay Prakash Dwivedi" },
    { name = "Johannes Hoffart" },
    { name = "Carlos Guestrin" },
    { name = "Jure Leskovec" },
]
keywords = [
    "synthetic data",
    "relational foundation models",
    "scaling laws",
    "structural causal models",
    "multi-table databases",
    "relbench",
    "pretraining",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "networkx",
    "numpy",
    "pandas",
    "pytorch-frame",
    "relbench>=3.0.0",
    "sqlalchemy>=2",
    "torch>=2",
    "tqdm",
]

[project.urls]
Homepage = "https://star-project.stanford.edu/plurel"
Repository = "https://github.com/snap-stanford/plurel"
Paper = "https://arxiv.org/abs/2602.04029"
Issues = "https://github.com/snap-stanford/plurel/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["plurel"]

[tool.hatch.build.targets.sdist]
only-include = [
    "plurel",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
plurel = { path = ".", editable = true }
torch = ">=2.8.0"
matplotlib = ">=3.10.8,<4"
scikit-learn = "<1.6.0"

[tool.pixi.dependencies]
pytest = ">=9.0.1,<10"
pytest-xdist = ">=3.8.0,<4"
pytest-sugar = ">=1.1.1,<2"
sqlalchemy = ">=2.0.45,<3"
pytest-env = ">=1.2.0,<2"
ipython = ">=9.9.0,<10"
pip = ">=25.3,<26"
huggingface_hub = ">=1.3.7,<2"
uv = ">=0.9.29,<1"
ruff = ">=0.15.0,<1"
pre-commit = ">=4.5.1,<5"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501", "E721", "E741", "F841"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["test"]
env = ["KMP_DUPLICATE_LIB_OK=TRUE"]
