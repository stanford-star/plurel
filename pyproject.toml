[project]
name = "plurel"
version = "2.0.0.dev0"
description = "Synthesize diverse relational databases and semi-synthetic tables using Structural Causal Models, enabling scaling laws for Relational Foundation Models."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Vignesh Kothapalli" },
    { name = "Rishabh Ranjan" },
    { name = "Valter Hudovernik" },
    { name = "Vijay Prakash Dwivedi" },
    { name = "Johannes Hoffart" },
    { name = "Carlos Guestrin" },
    { name = "Jure Leskovec" },
]
keywords = [
    "synthetic data",
    "relational foundation models",
    "scaling laws",
    "structural causal models",
    "multi-table databases",
    "relbench",
    "pretraining",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "pandas",
    "relbench>=3.0.0",
    "scipy",
]

[project.urls]
Homepage = "https://star-project.stanford.edu/plurel"
Repository = "https://github.com/stanford-star/plurel"
Paper = "https://arxiv.org/abs/2602.04029"
Issues = "https://github.com/stanford-star/plurel/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["plurel"]

[tool.hatch.build.targets.sdist]
only-include = [
    "plurel",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
plurel = { path = ".", editable = true }

[tool.pixi.dependencies]
pytest = ">=9.0.1,<10"
pytest-xdist = ">=3.8.0,<4"
pytest-sugar = ">=1.1.1,<2"
ipython = ">=9.9.0,<10"
pip = ">=25.3,<26"
huggingface_hub = ">=1.3.7,<2"
uv = ">=0.9.29,<1"
ruff = "==0.15.20"
pre-commit = ">=4.5.1,<5"
pyright = ">=1.1.400,<2"

[tool.pixi.tasks]
lint = "ruff check . && ruff format --check ."
typecheck = "pyright"
test = "pytest"
examples = "python scripts/readme_examples.py README.md"
recipes = "python -I scripts/run_recipes.py"
bench = "python benchmarks/run.py --out benchmarks/results/latest.json"
bench-report = "python benchmarks/report.py benchmarks/results/latest.json --out benchmarks/REPORT.md"
bench-smoke = "python benchmarks/run.py --sizes 1000 --repeats 1 --out benchmarks/results/smoke.json && python benchmarks/report.py benchmarks/results/smoke.json --out benchmarks/results/smoke.md"
wheel = "rm -rf dist && uv build --wheel"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501", "E721", "E741", "F841"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--durations=10 --maxfail=1 -n 8 --dist loadgroup"

[tool.pyright]
include = ["test/typing_examples.py"]
pythonVersion = "3.12"
reportUnnecessaryTypeIgnoreComment = "error"
